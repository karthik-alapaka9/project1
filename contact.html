<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11152b">
  <title>Contact — A little something</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101327; color: #f7f5ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow-x: hidden; padding: 6rem 0 2rem; background: radial-gradient(ellipse at 15% 20%, #3b2b72 0, transparent 34%), radial-gradient(ellipse at 85% 80%, #123d58 0, transparent 35%), #101327; }
    .glow { position: fixed; width: 22rem; aspect-ratio: 1; border-radius: 50%; filter: blur(90px); opacity: .3; pointer-events: none; animation: drift 12s ease-in-out infinite alternate; }
    .one { background: #9d68ff; top: -10rem; right: 8%; } .two { background: #35d9c5; bottom: -12rem; left: 5%; animation-delay: -5s; }
    nav { position: fixed; z-index: 2; top: 1.25rem; left: 50%; display: flex; gap: .35rem; padding: .4rem; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; background: rgba(16,19,39,.58); backdrop-filter: blur(14px); transform: translateX(-50%); }
    nav a { padding: .65rem 1rem; border-radius: 999px; color: #c1c4d8; font-size: .88rem; text-decoration: none; transition: color .2s ease, background .2s ease; }
    nav a:hover, nav a[aria-current="page"] { color: #fff; background: rgba(255,255,255,.12); } nav a:focus-visible { outline: 2px solid #8de9dc; outline-offset: 2px; }
    main { position: relative; width: min(680px, calc(100% - 36px)); padding: clamp(2rem, 7vw, 4.5rem); text-align: center; border: 1px solid rgba(255,255,255,.15); border-radius: 28px; background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.035)); box-shadow: 0 30px 100px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12); backdrop-filter: blur(18px); animation: arrive .8s cubic-bezier(.2,.8,.2,1) both; }
    .icon { display: grid; place-items: center; width: 66px; height: 66px; margin: 0 auto 1.6rem; border: 1px solid rgba(255,255,255,.22); border-radius: 20px; background: linear-gradient(135deg, #a477ff, #5e68e8 55%, #3bd5c4); box-shadow: 0 12px 35px rgba(116,103,255,.4); font-size: 1.8rem; transform: rotate(-7deg); }
    .eyebrow { margin: 0 0 .9rem; color: #c6bbff; font-size: .76rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.8rem, 9vw, 5.2rem); line-height: .98; letter-spacing: -.065em; }
    h1 span { display: block; padding-bottom: .09em; background: linear-gradient(100deg, #fff 14%, #c5b3ff 58%, #7de9db); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .description { max-width: 440px; margin: 1.5rem auto 2rem; color: #c1c4d8; font-size: 1.03rem; line-height: 1.7; }
    .contact-link { display: inline-flex; align-items: center; gap: .65rem; padding: .95rem 1.3rem; border-radius: 14px; color: #17152a; background: #f6f2ff; font-weight: 750; text-decoration: none; box-shadow: 0 8px 25px rgba(0,0,0,.22); transition: transform .2s ease, box-shadow .2s ease; }
    .contact-link:hover { transform: translateY(-3px); box-shadow: 0 13px 30px rgba(0,0,0,.3); } .contact-link:focus-visible { outline: 3px solid #8de9dc; outline-offset: 4px; }
    .note { margin: 1.2rem 0 0; color: #9de7dc; font-size: .9rem; }
    footer { margin-top: 2.3rem; color: #858aa6; font-size: .78rem; letter-spacing: .04em; }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } } @keyframes drift { to { transform: translate(50px, 35px) scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div><div class="glow two" aria-hidden="true"></div>
  <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
  <main>
    <div class="icon" aria-hidden="true">✉</div>
    <p class="eyebrow">The next hello is yours</p>
    <h1>Let’s <span>connect.</span></h1>
    <p class="description">Have an idea, a question, or just want to say hello? Drop a note and let’s start a conversation.</p>
    <a class="contact-link" href="mailto:hello@example.com">Email us <span aria-hidden="true">↗</span></a>
    <p class="note">We’d love to hear from you.</p>
    <footer>GOOD THINGS START WITH A NOTE ✨</footer>
  </main>
</body>
</html>
